<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Dynamic Orbital C Ring -->
  <path d="M 78 28 A 38 38 0 1 0 78 72" stroke="url(#orbitGradient)" stroke-width="8" stroke-linecap="round"/>
  <!-- Inner Violet Core -->
  <circle cx="50" cy="50" r="12" fill="url(#coreGradient)" />
  <circle cx="50" cy="50" r="16" stroke="#7C5CFF" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
  <!-- Gradients -->
  <defs>
    <linearGradient id="orbitGradient" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="60%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="coreGradient" x1="38" y1="38" x2="62" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C5CFF"/>
    </linearGradient>
  </defs>
</svg>